[package]
name = "cg-kernel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Upstream CodeGraph extraction kernel (MIT, colbymchenry/codegraph) with napi removed; see patches/"

[lib]
crate-type = ["rlib"]

[features]
default = ["lang-ts", "lang-python", "lang-go", "lang-java", "lang-rust", "lang-kotlin"]
lang-ts = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-rust = ["dep:tree-sitter-rust"]
lang-kotlin = ["dep:tree-sitter-language"]

[dependencies]
tree-sitter = "0.25"
sha2 = "0.10"
regex = "1"

# Grammars - MUST stay revision-matched with upstream (exact pins copied from
# upstream codegraph-kernel/Cargo.toml @ UPSTREAM_COMMIT; never bump on their own).
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-rust = { version = "=0.24.2", optional = true }
# Kotlin is vendored C (grammars/kotlin, compiled by build.rs): no usable crate exists.
tree-sitter-language = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
